name: Environment Practice

on:
  push:

env:
  APP_ENV: global
  TEST_TYPE: performance

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: job

    steps:
      - name: Show workflow variable
        run: |
          echo "APP_ENV with expression: ${{ env.APP_ENV }}"
          echo "APP_ENV from shell: $APP_ENV"
          echo "TEST_TYPE from shell: $TEST_TYPE"

      - name: Override variable
        env:
          APP_ENV: step
        run: |
          echo "APP_ENV in step: $APP_ENV"

      - name: Check variable after override
        run: |
          echo "APP_ENV: $APP_ENV"

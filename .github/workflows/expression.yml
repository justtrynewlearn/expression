name: Expression Practice

on:
  push:

jobs:
  conditions:
    runs-on: ubuntu-latest

    steps:
      - name: Always runs
        run: echo "Step 1 - Always runs"

      - name: Check master branch
        if: ${{ github.ref_name == 'master' }}
        run: echo "Step 2 - We are on master"

      - name: Check develop branch
        if: ${{ github.ref_name == 'develop' }}
        run: echo "Step 3 - We are on develop"

      - name: Check push event
        if: ${{ github.event_name == 'push' }}
        run: echo "Step 4 - Workflow was triggered by push"

      - name: Check pull request event
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Step 5 - Workflow was triggered by pull request"
